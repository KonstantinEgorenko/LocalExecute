schema_version: 1

autonomous_workflow_v1:
  max_workflow_steps: 48
  max_recovery_cycles_per_todo: 2
  max_context_expansions_per_todo: 2
  max_dependency_outcomes: 8
  max_optional_repo_artifacts: 12
  max_verified_outcome_chars: 12000

  serialize_gpu_execution: true
  require_root_goal: true
  require_project_snapshot: true
  require_dependency_outcomes: true
  require_deterministic_verification: true
  require_fresh_recovery_workspace: true

  # The model window is not the durable memory. initial_pack_tokens is only
  # the per-attempt projection from the external context spine. The rest is
  # intentionally reserved for tool feedback, generation and safety headroom.
  context_profiles:

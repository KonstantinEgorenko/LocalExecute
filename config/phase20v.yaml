schema_version: 1
model_runtime_v1:
  enabled_env: SWARM_MODEL_RUNTIME
  root_env: SWARM_MODEL_RUNTIME_ROOT
  lock_path_env: MODEL_RUNTIME_LOCK_PATH
  default_lock_path: 'C:/ProgramData/LocalExecute/locks/model_runtime.lock'
  acquire_timeout_seconds: 180.0
  poll_interval_seconds: 0.05
  memory_policy: MODEL_ONLY_HYBRID_GPU_RAM
  min_free_vram_mib: 0
  min_available_ram_mib: 16384
  worker_keep_alive: 10m
  status_poll_interval_seconds: 0.2
  lifecycle_timeout_seconds: 120.0
  fail_closed: true
  final_cleanup: true
  external_observe_urls:
    - http://127.0.0.1:11434
  runtime_profile_cache: state/evaluation/phase20v/runtime_profiles.json
  placement_calibration:
    enabled: true
    min_num_gpu: 1
    max_attempts: 8
    safety_margin_mib: 128
    max_worker_vram_mib: 11264
  todo_tag_resolution:
    deepseek_fast_coder:
      all_tokens: [deepseek, coder, v2]
      any_tokens: [16b, lite]
    iquest_repo_coder:
      all_tokens: [iquest, 14b]
      any_tokens: []

schema_version: 1
external_research_v1:
  max_search_rounds: 3
  max_queries_per_round: 8
  max_results_per_query: 8
  max_sources_total: 48
  max_source_bytes: 524288
  max_source_text_chars: 120000
  max_evidence_items: 128
  max_excerpt_chars: 6000
  max_claims: 48
  min_sources_per_important_claim: 2
  min_source_domains: 2
  require_primary_for_critical_claims: true
  require_zero_unresolved_critical_contradictions: true
  require_read_only_tools: true
  block_private_network_targets: true
  max_redirects: 4
  request_timeout_seconds: 20
  searxng:
    enabled: true
    base_url_env: PHASE18_SEARXNG_BASE_URL
    allow_private_backend: true
  github:
    enabled: true
    token_env: GITHUB_TOKEN
    api_base_url: https://api.github.com
  live_acceptance:
    research_cases: 3
    min_success_rate: 1.0
